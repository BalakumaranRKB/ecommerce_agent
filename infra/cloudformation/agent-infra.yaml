AWSTemplateFormatVersion: "2010-09-09"
Description: >
  E-commerce order-support agent: ECR, ECS/Fargate service, ALB, RDS PostgreSQL
  with pgvector, request-count autoscaling, and the GitHub OIDC deploy role plus
  ECS task execution role. One command up, one command down.

# WHAT CHANGED FROM SESSION 4's agent-cicd TEMPLATE, AND WHY
#   - RDS added        retrieval runs against real Postgres+pgvector, not a local
#                      store (PLAN §2.6.2). Session 4's agent had no database.
#   - ECS SG locked    Session 4 allowed 0.0.0.0/0 to the tasks. PLAN §7.5 requires
#                      ingress from the ALB's security group ONLY.
#   - Autoscaling      ScalableTarget + target-tracking policy on request count,
#                      which Session 4 did not have at all.
#   - Task sizing      256/512 -> 1024/2048. Session 4's agent did keyword matching;
#                      this one loads sentence-transformers, which pulls PyTorch and
#                      will not fit in 512MB (PLAN §13).
#   - EmptyOnDelete    every CI push adds an image; ECR refuses to delete a
#                      non-empty repository and teardown fails without this.
#
# The GitHub OIDC provider is account-wide and deliberately NOT managed here —
# other repos may depend on it, so it is created once by setup_oidc_provider.sh
# and passed in as a parameter. A stack teardown must never risk deleting a
# shared account-level resource.
#
# BOUNDARY: this stack owns the INFRASTRUCTURE. GitHub Actions owns WHICH IMAGE
# IS RUNNING — every push registers a new task definition revision and calls
# ecs:UpdateService outside this stack. ContainerImage only seeds the initial
# task definition; deploy_stack.sh re-passes the currently-running image on every
# later update so an unrelated infra change can never roll the service back to
# the bootstrap placeholder.

Parameters:
  AppName:
    Type: String
    Default: ordercare-agent
  GitHubOrg:
    Type: String
    Description: GitHub username or org
  GitHubRepo:
    Type: String
    Description: Repo name this workflow lives in
  GitHubOidcProviderArn:
    Type: String
    Description: ARN of the account's shared token.actions.githubusercontent.com OIDC provider
  VpcId:
    Type: AWS::EC2::VPC::Id
  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Must span at least two AZs — RDS subnet groups require it.
  ContainerImage:
    Type: String
    Description: Full ECR image URI:tag. Bootstrap on first create; the currently-running image on every later update.
  DbPassword:
    Type: String
    NoEcho: true
    Description: RDS master password. Generated by deploy_stack.sh and mirrored into SSM for the task to read.
  DbName:
    Type: String
    Default: ordercare
  DbUsername:
    Type: String
    Default: ordercare
  MinTasks:
    Type: Number
    Default: 1
    Description: >
      1, not 2. This is a demo stack that is torn down the same day, and a single
      task is enough to serve the ALB. Production would use 2 for AZ redundancy.
  MaxTasks:
    Type: Number
    Default: 4
    Description: >
      4 is a deliberate cost ceiling. The scale-out demo only needs to show the
      count RISING; an unbounded max on a billing-by-the-second service during a
      load loop is how a demo becomes an invoice.
  RequestsPerTargetTarget:
    Type: Number
    Default: 20
    Description: >
      Requests per target per minute. Chosen low because each ticket takes ~10s
      (mostly blocked on the LLM), so a handful of concurrent clients crosses it —
      the policy has to actually fire during a 4-5 minute demo window.

Resources:

  # ---------------------------------------------------------------- registry
  EcrRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Ref AppName
      # Without this, teardown fails: ECR will not delete a repository that
      # still holds images, and CI pushes one on every green build.
      EmptyOnDelete: true
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [{
              "rulePriority": 1,
              "description": "Keep only the 5 most recent images",
              "selection": {
                "tagStatus": "any",
                "countType": "imageCountMoreThan",
                "countNumber": 5
              },
              "action": { "type": "expire" }
            }]
          }

  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/ecs/${AppName}"
      RetentionInDays: 7

  EcsCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub "${AppName}-cluster"

  # ------------------------------------------------------------------- roles
  EcsExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${AppName}-ecs-execution-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: !Sub "${AppName}-ssm-read"
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: ssm:GetParameters
                Resource: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${AppName}/*"

  # Two traps from PLAN §13, encoded so they cannot regress:
  #   (1) configure-aws-credentials@v4 tags every session by default, so
  #       sts:TagSession must be allowed alongside AssumeRoleWithWebIdentity or
  #       every assumption is rejected with an unhelpful error.
  #   (2) GitHub's OIDC `sub` claim carries numeric IDs suffixed onto the owner
  #       and repo names ("repo:OWNER@12345/REPO@67890:ref:..."), not the plain
  #       string most docs show. StringLike wildcards handle either format;
  #       StringEquals would reject the real token.
  GitHubDeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${AppName}-github-deploy-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Federated: !Ref GitHubOidcProviderArn }
            Action: ["sts:AssumeRoleWithWebIdentity", "sts:TagSession"]
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                token.actions.githubusercontent.com:sub: !Sub "repo:${GitHubOrg}*/${GitHubRepo}*:*"
      Policies:
        - PolicyName: !Sub "${AppName}-deploy-policy"
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: "*"
              - Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:GetDownloadUrlForLayer
                  - ecr:BatchGetImage
                  - ecr:PutImage
                  - ecr:InitiateLayerUpload
                  - ecr:UploadLayerPart
                  - ecr:CompleteLayerUpload
                Resource: !GetAtt EcrRepository.Arn
              - Effect: Allow
                Action:
                  - ecs:RegisterTaskDefinition
                  - ecs:DescribeTaskDefinition
                  - ecs:UpdateService
                  - ecs:DescribeServices
                Resource: "*"
              - Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt EcsExecutionRole.Arn

  # --------------------------------------------------------- security groups
  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      # ASCII ONLY. EC2 rejects non-ASCII in GroupDescription, and the error
      # ('Character sets beyond ASCII are not supported') arrives only after the
      # stack has started building. Em dashes and section signs belong in the
      # comments, not in values that reach an AWS API.
      GroupDescription: !Sub "${AppName} ALB - public 80"
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
          Description: Public HTTP. This is the only thing the internet may reach.

  EcsSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub "${AppName} tasks - 8080 from the ALB only"
      VpcId: !Ref VpcId

  # Defined as a separate resource, not inline, because SG-to-SG references
  # inside SecurityGroupIngress create a circular dependency CloudFormation
  # cannot resolve.
  #
  # This rule is the point of PLAN §7.5: Session 4's demo left the tasks open to
  # 0.0.0.0/0, which makes them directly reachable and lets callers bypass the
  # load balancer entirely. Admitting only the ALB's security group closes that.
  #
  # The Description below is deliberately terse. EC2 restricts rule descriptions
  # to `a-zA-Z0-9. _-:/()#,@[]+=&;{}!$*` — no apostrophes, no em dashes — and
  # rejects the whole stack if one slips in.
  EcsIngressFromAlb:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref EcsSecurityGroup
      IpProtocol: tcp
      FromPort: 8080
      ToPort: 8080
      SourceSecurityGroupId: !Ref AlbSecurityGroup
      Description: ALB only (PLAN 7.5) - tasks are not reachable from 0.0.0.0/0

  DbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub "${AppName} RDS - 5432 from the tasks only"
      VpcId: !Ref VpcId

  DbIngressFromEcs:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref DbSecurityGroup
      IpProtocol: tcp
      FromPort: 5432
      ToPort: 5432
      SourceSecurityGroupId: !Ref EcsSecurityGroup
      Description: Only the agent tasks may reach the database.

  # ----------------------------------------------------------------- database
  DbSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: !Sub "${AppName} database subnets"
      SubnetIds: !Ref SubnetIds

  # DeletionPolicy AND UpdateReplacePolicy both set to Delete: AWS::RDS::DBInstance
  # defaults to Snapshot, which silently leaves a billing artifact behind after
  # teardown — PLAN §13 and §2.6.5 both call this out.
  Database:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      DBInstanceIdentifier: !Sub "${AppName}-db"
      DBName: !Ref DbName
      Engine: postgres
      EngineVersion: "16"
      DBInstanceClass: db.t4g.micro
      AllocatedStorage: "20"
      StorageType: gp3
      MasterUsername: !Ref DbUsername
      MasterUserPassword: !Ref DbPassword
      DBSubnetGroupName: !Ref DbSubnetGroup
      VPCSecurityGroups: [!Ref DbSecurityGroup]
      # Unreachable from the internet regardless of which subnet it lands in.
      # This is also why ingest runs as a one-off ECS task (run_ingest.sh)
      # rather than from a laptop.
      PubliclyAccessible: false
      MultiAZ: false
      BackupRetentionPeriod: 0
      DeleteAutomatedBackups: true
      StorageEncrypted: true

  # ---------------------------------------------------------------- the ALB
  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub "${AppName}-alb"
      Scheme: internet-facing
      Type: application
      Subnets: !Ref SubnetIds
      SecurityGroups: [!Ref AlbSecurityGroup]

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub "${AppName}-tg"
      # TargetType ip is mandatory for Fargate/awsvpc — the default (instance)
      # silently registers nothing and the service never becomes healthy.
      TargetType: ip
      Protocol: HTTP
      Port: 8080
      VpcId: !Ref VpcId
      HealthCheckPath: /health
      HealthCheckIntervalSeconds: 15
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      TargetGroupAttributes:
        - Key: deregistration_delay.timeout_seconds
          Value: "30"

  Listener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup

  # ------------------------------------------------------------------- tasks
  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub "${AppName}-task"
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      # PLAN §13: 256/512 will not hold sentence-transformers + PyTorch. The
      # failure mode is a task that starts, OOMs during model load, and is
      # killed — visible only as a restart loop in CloudWatch.
      Cpu: "1024"
      Memory: "2048"
      ExecutionRoleArn: !GetAtt EcsExecutionRole.Arn
      ContainerDefinitions:
        - Name: !Ref AppName
          Image: !Ref ContainerImage
          Essential: true
          PortMappings:
            - ContainerPort: 8080
              Protocol: tcp
          Environment:
            - Name: LLM_PROVIDER
              Value: anthropic
            - Name: DB_HOST
              Value: !GetAtt Database.Endpoint.Address
            # 5432 here, not the 55432 used locally. That local override exists
            # only to dodge a host Postgres install; nothing else has that clash.
            - Name: DB_PORT
              Value: "5432"
            - Name: DB_NAME
              Value: !Ref DbName
            - Name: DB_USER
              Value: !Ref DbUsername
            # Without this, print() output buffers and CloudWatch shows nothing
            # while the container is starting — debugging blind on Fargate.
            - Name: PYTHONUNBUFFERED
              Value: "1"
          Secrets:
            - Name: ANTHROPIC_API_KEY
              ValueFrom: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${AppName}/ANTHROPIC_API_KEY"
            - Name: DB_PASSWORD
              ValueFrom: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${AppName}/DB_PASSWORD"
            - Name: LANGFUSE_HOST
              ValueFrom: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${AppName}/LANGFUSE_HOST"
            - Name: LANGFUSE_PUBLIC_KEY
              ValueFrom: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${AppName}/LANGFUSE_PUBLIC_KEY"
            - Name: LANGFUSE_SECRET_KEY
              ValueFrom: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${AppName}/LANGFUSE_SECRET_KEY"
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: ecs

  EcsService:
    Type: AWS::ECS::Service
    DependsOn: Listener
    Properties:
      ServiceName: !Sub "${AppName}-service"
      Cluster: !Ref EcsCluster
      TaskDefinition: !Ref TaskDefinition
      DesiredCount: !Ref MinTasks
      LaunchType: FARGATE
      # Generous because the container loads the embedding model before it can
      # serve. /health is static so it answers immediately, but the grace period
      # protects against the ALB killing a task that is still warming up.
      HealthCheckGracePeriodSeconds: 90
      NetworkConfiguration:
        AwsvpcConfiguration:
          Subnets: !Ref SubnetIds
          SecurityGroups: [!Ref EcsSecurityGroup]
          # Public IP so the task can reach ECR, the Anthropic API, and
          # LangFuse without a NAT Gateway (~$32/month, PLAN §13). The task is
          # still not reachable inbound — the security group only admits the ALB.
          AssignPublicIp: ENABLED
      LoadBalancers:
        - ContainerName: !Ref AppName
          ContainerPort: 8080
          TargetGroupArn: !Ref TargetGroup

  # ------------------------------------------------------------- autoscaling
  ScalableTarget:
    Type: AWS::ApplicationAutoScaling::ScalableTarget
    Properties:
      ServiceNamespace: ecs
      ScalableDimension: ecs:service:DesiredCount
      ResourceId: !Sub
        - "service/${Cluster}/${Service}"
        - Cluster: !Ref EcsCluster
          Service: !GetAtt EcsService.Name
      MinCapacity: !Ref MinTasks
      MaxCapacity: !Ref MaxTasks
      RoleARN: !Sub "arn:aws:iam::${AWS::AccountId}:role/aws-service-role/ecs.application-autoscaling.amazonaws.com/AWSServiceRoleForApplicationAutoScaling_ECSService"

  # ALBRequestCountPerTarget, NOT CPUUtilization. This agent spends its time
  # blocked on network I/O waiting for the LLM — Stage 1 measured a 11.6s turn
  # with 0.02s of retrieval — so CPU can stay flat under genuine load and a
  # CPU-target policy would never fire (PLAN §13).
  ScalingPolicy:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Properties:
      PolicyName: !Sub "${AppName}-request-count-target-tracking"
      PolicyType: TargetTrackingScaling
      ScalingTargetId: !Ref ScalableTarget
      TargetTrackingScalingPolicyConfiguration:
        TargetValue: !Ref RequestsPerTargetTarget
        PredefinedMetricSpecification:
          PredefinedMetricType: ALBRequestCountPerTarget
          # Must be exactly app/<alb-name>/<alb-id>/targetgroup/<tg-name>/<tg-id>.
          # Built from the two FullName attributes rather than pasted — PLAN §13
          # warns that hand-writing this is a common and hard-to-spot failure.
          ResourceLabel: !Join
            - "/"
            - - !GetAtt LoadBalancer.LoadBalancerFullName
              - !GetAtt TargetGroup.TargetGroupFullName
        ScaleOutCooldown: 60
        # Long on purpose: scale-in during a demo would hide the evidence.
        # Also why task count stays elevated for ~15 min after the load stops.
        ScaleInCooldown: 300

Outputs:
  AlbDnsName:
    Description: Stable public URL — survives every redeploy.
    Value: !GetAtt LoadBalancer.DNSName
  GitHubDeployRoleArn:
    Value: !GetAtt GitHubDeployRole.Arn
  EcrRepositoryUri:
    Value: !GetAtt EcrRepository.RepositoryUri
  EcsClusterName:
    Value: !Ref EcsCluster
  EcsServiceName:
    Value: !GetAtt EcsService.Name
  TaskDefinitionFamily:
    Value: !Sub "${AppName}-task"
  DbEndpoint:
    Value: !GetAtt Database.Endpoint.Address
  EcsSecurityGroupId:
    Description: Needed by run_ingest.sh to launch the one-off ingest task.
    Value: !Ref EcsSecurityGroup
