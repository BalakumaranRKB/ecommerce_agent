name: CI

on:
  push:
    branches:
      - main
      - assignment-3
  pull_request:
    branches:
      - main
      - assignment-3

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-suite:
    name: Assignment 3 Test Suite Gate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync

      - name: Run Cost Ledger Tests (Phase 7)
        run: uv run python test_cost_ledger.py

      - name: Run Semantic Cache Tests (Phase 7)
        run: uv run python test_semantic_cache.py

      - name: Run Layered PII Masking Tests (Phase 6)
        run: uv run python test_pii_masking.py

      - name: Run HITL Approval Gate Tests (Phase 5)
        run: uv run python test_hitl_gate.py

      - name: Run Refund Settlement Seam Tests (Phase 5)
        run: uv run python test_settlement.py

      - name: Run Policy Boundary Tests (Phase 5)
        run: uv run python test_policy_boundary.py

      - name: Run Structured Output Decisions Tests (Phase 4)
        run: uv run python test_structured_decision.py

      - name: Run Billing Specialist Dispute Resolution Tests (Phase 1)
        run: uv run python -m billing_specialist.test_resolve_dispute

      - name: Run A2A Roundtrip Protocol Tests (Phase 1)
        run: uv run python -m billing_specialist.test_a2a_roundtrip
